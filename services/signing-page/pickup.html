<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取货 · 人人担保</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<main>
  <h1>取货</h1>
  <p class="sub">卡密是用你的取货钥匙加密后放在这一单合约里的，只有你能解开</p>

  <div id="fatal" class="banner bad" hidden></div>

  <div id="body" hidden>
    <div class="card">
      <dl class="kv">
        <dt>状态</dt><dd id="state"></dd>
        <dt>货款</dt><dd id="price"></dd>
        <dt>交易合约</dt><dd class="mono" id="deal"></dd>
      </dl>
    </div>

    <div id="notice" class="banner" hidden></div>

    <div id="open-box">
      <p id="status"></p>
      <button id="go">连接钱包，签名取卡密</button>
      <p class="sub" style="text-align:center">签名不花钱、不转账。用的是你下单时的那个钱包</p>
    </div>

    <div id="got" class="card" hidden>
      <h2>你的卡密</h2>
      <div class="code" id="code"></div>
      <button id="copy" class="ghost">复制卡密</button>
      <div id="after"></div>
    </div>
  </div>
</main>
<script src="vendor/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script src="pickup.js"></script>
<script src="shop.js"></script>
<script src="pickup-page.js"></script>
</body>
</html>
