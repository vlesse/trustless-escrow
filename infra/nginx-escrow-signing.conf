server {
    server_name db.renrenyings.net;

    root /srv/escrow/services/signing-page;
    index index.html;

    # 签名页是纯静态的：没有后端、没有数据库、不收集任何东西。
    # 用户的私钥全程在自己的钱包里，这个页面只负责把机器人算好的
    # calldata 递给钱包，并在递之前核对目标合约确实属于本协议。
    location / {
        try_files $uri $uri/ =404;
    }

    # config.js 是部署方唯一要改的文件，不能被缓存住旧的合约地址
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/db.renrenyings.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/db.renrenyings.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = db.renrenyings.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name db.renrenyings.net;
    return 404; # managed by Certbot


}